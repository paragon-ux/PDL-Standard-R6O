name: R6O-2 qualification

on:
  pull_request:
  push:
    branches:
      - codex/r6o-2-view-rewrite

permissions:
  contents: read

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout R6O candidate
        uses: actions/checkout@v4
        with:
          path: PDL-Standard-R6O
          fetch-depth: 0

      - name: Checkout frozen R6S oracle
        uses: actions/checkout@v4
        with:
          repository: paragon-ux/PDL-Standard-REPL-Harness
          ref: 60d982f3328b45a351879d67dc4bb525172b65fd
          path: PDL-Standard-REPL-Harness
          token: ${{ secrets.PDL_BASELINE_TOKEN || github.token }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: PDL-Standard-R6O/requirements-r6o2.txt

      - name: Install qualification dependencies
        working-directory: PDL-Standard-R6O
        run: python -m pip install -r requirements-r6o2.txt

      - name: R6O-2 canonical non-display gates
        working-directory: PDL-Standard-R6O
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PDL_R6S_BASELINE_REPO: ${{ github.workspace }}/PDL-Standard-REPL-Harness
        run: python scripts/verify_r6o2.py

      - name: Declare local visual gate
        run: echo "LOCAL_DISPLAY_GATE_REQUIRED - run python scripts/verify_r6o2.py --display on a display-capable machine"
