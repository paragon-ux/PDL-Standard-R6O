name: R6O-2 qualification

on:
  pull_request:
  push:
    branches:
      - codex/r6o-2-views

permissions:
  contents: read

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout R6O candidate
        uses: actions/checkout@v4
        with:
          path: PDL-Standard-R6O

      - name: Checkout frozen R6S oracle
        uses: actions/checkout@v4
        with:
          repository: paragon-ux/PDL-Standard-REPL-Harness
          ref: 60d982f3328b45a351879d67dc4bb525172b65fd
          path: PDL-Standard-REPL-Harness

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install qualification dependencies
        run: python -m pip install pytest==9.0.3 jsonschema==4.26.0

      - name: R6O-2 verifier (mechanical gates)
        working-directory: PDL-Standard-R6O
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PDL_R6S_BASELINE_REPO: ${{ github.workspace }}/PDL-Standard-REPL-Harness
        run: python scripts/verify_r6o2.py

      - name: Display-dependent checks
        run: echo "Display-dependent Tk checks are opt-in (R6O2_RUN_DISPLAY_TESTS=1); not part of canonical CI."
