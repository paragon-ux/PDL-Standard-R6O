name: H2-C Qt Quick feasibility

on:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-h2-sidecar.txt
      - run: python -m pip install -r requirements-h2-sidecar.txt
      - name: Windows Qt Quick shell proof
        env:
          QSG_RHI_BACKEND: software
          QT_SCALE_FACTOR: "1"
          QT_FONT_DPI: "96"
        run: python scripts/h2/verify_qt_sidecar_feasibility.py --platform windows
      - name: Focused tests
        env:
          QSG_RHI_BACKEND: software
          QT_SCALE_FACTOR: "1"
          QT_FONT_DPI: "96"
        run: python -m pytest r6o/tests/h2/test_qt_sidecar_feasibility.py -q -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        with:
          name: h2-c-qt-feasibility-windows
          path: r6o_evidence/H2-C-QT-QUICK/feasibility/windows

  linux-x11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-h2-sidecar.txt
      - name: Install X11 display dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb x11-utils openbox xcompmgr libegl1 libxkbcommon-x11-0 libxcb-cursor0
      - run: python -m pip install -r requirements-h2-sidecar.txt
      - name: Linux X11 Qt Quick shell proof
        env:
          QSG_RHI_BACKEND: software
          QT_QPA_PLATFORM: xcb
          QT_SCALE_FACTOR: "1"
          QT_FONT_DPI: "96"
        run: |
          Xvfb :99 -screen 0 1280x1024x24 >"$RUNNER_TEMP/xvfb.log" 2>&1 &
          export DISPLAY=:99
          for attempt in {1..50}; do
            xdpyinfo -display :99 >/dev/null 2>&1 && break
            sleep 0.1
          done
          xdpyinfo -display :99 >/dev/null
          openbox >"$RUNNER_TEMP/openbox.log" 2>&1 &
          xcompmgr -c -n >"$RUNNER_TEMP/xcompmgr.log" 2>&1 &
          python scripts/h2/verify_qt_sidecar_feasibility.py --platform x11
          python -m pytest r6o/tests/h2/test_qt_sidecar_feasibility.py -q -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        with:
          name: h2-c-qt-feasibility-linux-x11
          path: r6o_evidence/H2-C-QT-QUICK/feasibility/x11

  linux-wayland:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-h2-sidecar.txt
      - name: Install Wayland display dependencies
        run: sudo apt-get update && sudo apt-get install -y weston libegl1 libxkbcommon-x11-0
      - run: python -m pip install -r requirements-h2-sidecar.txt
      - name: Linux Wayland Qt Quick shell proof
        env:
          QSG_RHI_BACKEND: software
          QT_QPA_PLATFORM: wayland
          QT_SCALE_FACTOR: "1"
          QT_FONT_DPI: "96"
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-runtime"
          export WAYLAND_DISPLAY=wayland-h2c
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" --idle-time=0 --log="$RUNNER_TEMP/weston.log" &
          for attempt in {1..50}; do
            test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" && break
            sleep 0.1
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          python scripts/h2/verify_qt_sidecar_feasibility.py --platform wayland
          python -m pytest r6o/tests/h2/test_qt_sidecar_feasibility.py -q -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        with:
          name: h2-c-qt-feasibility-linux-wayland
          path: r6o_evidence/H2-C-QT-QUICK/feasibility/wayland
